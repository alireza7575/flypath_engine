[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flypath-engine"
version = "0.1.0"
description = "Shared mission-planning engine for FlyPath"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
dependencies = [
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["flypath_engine"]
